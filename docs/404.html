<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>BHH NCD Profile - Redirecting</title>
    <script type="text/javascript">
      var pathSegmentsToKeep = 1; // For project pages /bhh-ncd-profile/
      var l = window.location;
      
      // If we are on custom domain, we might keep 0 segments
      // We will check if pathname has a subfolder or not
      var pathParts = l.pathname.split('/');
      var projectName = pathParts[1] || '';
      
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' + projectName + '/';
      l.replace(redirectUrl);
    </script>
  </head>
  <body>
    Redirecting to BHH NCD Profile...
  </body>
</html>
